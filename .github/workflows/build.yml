name: build

# Releases are cut from tags: `v0.1.0` (and pre-releases like `v0.2.0-rc1`).
# Publishing a GitHub Release also triggers a build, so assets can be attached
# to it after the fact. workflow_dispatch builds without publishing; each
# variant is its OWN on/off input, so a manual run compiles exactly the
# variants it asks for instead of picking one value from a three-way list.
#
#   Web      : one self-contained executable per platform (wasm UI embedded,
#              served over the embedded HTTP server)
#   Webview  : one executable per platform (native window via the OS web engine)
#
# Web and webview are built in ONE job: they share the output directory and the
# executable name carries the variant (flashsight-web / flashsight-webview),
# and switching variants only recompiles the two backend files plus main.cpp.
# Building them separately would compile the whole project twice.
#
# WhaleUI needs a WhaleUI checkout and a build of its engine, which this repo
# does not vendor. It therefore runs in its own opt-in job: set the repository
# variable ENABLE_WHALEUI=true (and WHALEUI_REPO if the fork differs) to turn it
# on, and use the `whaleui` dispatch input to include it in a manual run.
# See doc-internal/ui-whaleui.md.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      web:
        description: "Build the Web variant (browser + embedded HTTP server)"
        type: boolean
        default: true
      webview:
        description: "Build the WebView variant (native window, OS web engine)"
        type: boolean
        default: true
      whaleui:
        description: "Build the WhaleUI variant (needs ENABLE_WHALEUI=true)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # xmake is a single binary; pinning the version keeps the build reproducible.
  XMAKE_VERSION: v3.0.6
  # Emscripten compiles the UI to wasm. The bundle is architecture-independent,
  # so every runner uses the same SDK.
  EMSDK_VERSION: 3.1.61

jobs:
  # ------------------------------------------------------------------------
  # Resolve the version and the matrix once, so every job agrees on the names
  # that end up in the release.
  # ------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: v
        name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            ref="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            ref="${{ github.ref_name }}"
          else
            ref="0.0.0-dev"
          fi
          # Strip a leading v so the archive names stay uniform.
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${ref#v}"
      - id: m
        name: Build matrix
        run: |
          # One entry per (runner, target arch). Supported today:
          #   windows-x86_64   native MSYS2 mingw64
          #   windows-arm64    llvm-mingw aarch64 (cross from the x64 runner)
          #   macos-arm64      Xcode clang, WKWebView
          #   linux-x86_64     gcc, WebKitGTK 4.1
          #   linux-aarch64    gcc on an arm64 runner, WebKitGTK 4.1
          #
          # Nothing else is attempted: webview has no backend for the remaining
          # platforms, so a package would not run there.
          #
          # `toolchain` empty means "the platform default" (clang on macOS).
          # `mingw` selects how the Windows toolchain is installed; the actual
          # directory is resolved in the build job.
          matrix=$(cat <<'JSON'
          {
            "include": [
              {
                "name": "windows-x86_64",
                "os": "windows-latest",
                "arch": "x86_64",
                "toolchain": "mingw",
                "mingw": "msys2",
                "py": "python"
              },
              {
                "name": "windows-arm64",
                "os": "windows-latest",
                "arch": "arm64",
                "toolchain": "mingw",
                "mingw": "llvm",
                "py": "python"
              },
              {
                "name": "macos-arm64",
                "os": "macos-14",
                "arch": "arm64",
                "toolchain": "",
                "mingw": "",
                "py": "python3"
              },
              {
                "name": "linux-x86_64",
                "os": "ubuntu-24.04",
                "arch": "x86_64",
                "toolchain": "gcc",
                "mingw": "",
                "py": "python3"
              },
              {
                "name": "linux-aarch64",
                "os": "ubuntu-24.04-arm",
                "arch": "arm64",
                "toolchain": "gcc",
                "mingw": "",
                "py": "python3"
              }
            ]
          }
          JSON
          )
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The version stamp falls back to `git describe`, which needs tags.
          fetch-depth: 0

      # ---- toolchains -----------------------------------------------------
      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          actions-cache-folder: .xmake-cache

      - name: Install MSYS2 mingw64 (Windows x86_64)
        if: matrix.mingw == 'msys2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Install llvm-mingw (Windows arm64)
        if: matrix.mingw == 'llvm'
        shell: pwsh
        run: |
          # llvm-mingw provides target-prefixed gcc-named driver wrappers, which
          # is exactly what xmake's mingw toolchain looks for with
          # --arch=arm64 (aarch64-w64-mingw32-gcc). Its own find_mingw.lua has a
          # dedicated branch for this prefix.
          $ver = "20240417"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\llvm-mingw -Force
          $dir = (Get-ChildItem C:\llvm-mingw -Directory | Select-Object -First 1).FullName
          $gcc = Join-Path $dir "bin\aarch64-w64-mingw32-gcc.exe"
          if (-not (Test-Path $gcc)) {
            Write-Error "llvm-mingw has no aarch64-w64-mingw32-gcc wrapper at $gcc"
            exit 1
          }
          "MINGW_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "llvm-mingw at $dir"
          & $gcc --version | Select-Object -First 1

      - name: Set MSYS2 mingw dir
        if: matrix.mingw == 'msys2'
        run: echo "MINGW_DIR=C:/msys64/mingw64" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.os != 'windows-latest' && matrix.os != 'macos-14'
        run: |
          sudo apt-get update
          # WebKitGTK 4.1 + GTK3 are what the webview Linux backend compiles
          # against (see the webview_host target in xmake.lua).
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: .emsdk-cache

      # ---- dependencies ---------------------------------------------------
      - name: Fetch 3rdparty
        run: ${{ matrix.py }} scripts/fetch_3rdparty.py

      # mbedtls is built from SOURCE by the `mbedtls_src` target with the
      # project toolchain (fetch_3rdparty.py downloads it). It is deliberately
      # not an xmake package: a prebuilt archive produced by another compiler
      # mixes two C runtimes, and every HTTPS request then crashed inside
      # RtlFreeHeap. Nothing extra is needed here - just the sources.

      # The three variants are three xmake targets. Configure once, then build
      # exactly the selected target names; no --variant switch, no wrapper
      # script, and adding/removing a variant cannot leave a stale cached value.
      - name: Select variants
        id: want
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            web="${{ github.event.inputs.web }}"
            webview="${{ github.event.inputs.webview }}"
            whaleui="${{ github.event.inputs.whaleui }}"
          else
            web=true
            webview=true
            whaleui=false
          fi
          [ "$web" = "true" ] && web=1 || web=0
          [ "$webview" = "true" ] && webview=1 || webview=0
          [ "$whaleui" = "true" ] && whaleui=1 || whaleui=0
          if [ "$web" = "0" ] && [ "$webview" = "0" ]; then
            echo "at least one of web/webview must be enabled"
            exit 1
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "webview=$webview" >> "$GITHUB_OUTPUT"
          echo "whaleui=$whaleui" >> "$GITHUB_OUTPUT"
          echo "selected: web=$web webview=$webview whaleui=$whaleui"

      - name: Configure
        run: |
          args=(-y -m release --arch=${{ matrix.arch }})
          if [ -n "${{ matrix.toolchain }}" ]; then
            args+=(--toolchain=${{ matrix.toolchain }})
          fi
          if [ -n "${MINGW_DIR:-}" ]; then
            args+=(--mingw="$MINGW_DIR")
          fi
          echo "xmake f ${args[*]}"
          xmake f "${args[@]}"

      - name: Build selected targets
        run: |
          targets=()
          if [ "${{ steps.want.outputs.web }}" = "1" ]; then targets+=(flashsight-web); fi
          if [ "${{ steps.want.outputs.webview }}" = "1" ]; then targets+=(flashsight-webview); fi
          echo "xmake b ${targets[*]}"
          xmake -y b "${targets[@]}"

      # The two failures that actually shipped a broken package: a webview exe
      # with no embedded CSS (the asset pack had been overwritten by the web
      # variant's), and a "whaleui" package that was really the web build.
      # Both are cheap to assert here and impossible to notice afterwards.
      #
      # The lookup is deliberately platform-agnostic: the binary is
      # flashsight-web.exe on Windows and flashsight-web elsewhere, and the
      # output directory is build/<plat>/<arch>/<mode> (so macosx/arm64 and
      # linux/x86_64 do not look like windows/x64).
      - name: Verify embedded assets
        run: |
          ${{ matrix.py }} - <<'PY'
          import pathlib, sys

          roots = sorted(p for p in pathlib.Path("build").glob("*/*/release")
                         if p.is_dir())
          if not roots:
              sys.exit("no build/<plat>/<arch>/release directory found")
          root = roots[0]
          print("output dir:", root)

          def find(variant):
              for name in ("flashsight-%s.exe" % variant, "flashsight-%s" % variant):
                  p = root / name
                  if p.is_file():
                      return p
              return None

          wanted = []
          if "${{ steps.want.outputs.web }}" == "1":
              wanted.append(("web", (b"#fs-root", b"fs_ui.wasm", b"--text-dim")))
          if "${{ steps.want.outputs.webview }}" == "1":
              wanted.append(("webview", (b"#fs-root", b"--text-dim")))
          if not wanted:
              sys.exit("no variant was selected")

          for variant, needles in wanted:
              p = find(variant)
              if p is None:
                  sys.exit("missing flashsight-%s in %s (build the target "
                           "flashsight-%s)" % (variant, root, variant))
              data = p.read_bytes()
              for n in needles:
                  if n not in data:
                      sys.exit("%s is missing embedded asset %r - the asset pack "
                               "was not rebuilt for this target" % (p.name, n))
              print("%-28s %8.2f MB  assets ok" % (p.name, len(data) / 1e6))
          PY

      # ---- package --------------------------------------------------------
      # One archive per variant per platform:
      #   flashsight-<version>-<platform>-web.zip|tar.gz
      #   flashsight-<version>-<platform>-webview.zip|tar.gz
      - name: Package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if [ "${{ steps.want.outputs.web }}" = "1" ]; then
            ${{ matrix.py }} scripts/package.py --variant web \
              --build-dir build --out dist \
              --version "$VERSION" --platform "${{ matrix.name }}"
          fi
          if [ "${{ steps.want.outputs.webview }}" = "1" ]; then
            ${{ matrix.py }} scripts/package.py --variant webview \
              --build-dir build --out dist \
              --version "$VERSION" --platform "${{ matrix.name }}"
          fi

      - name: Verify archives
        run: |
          # A package that is suspiciously small means the executable or the
          # embedded assets are missing - catch that here, not after publishing.
          ${{ matrix.py }} - <<'PY'
          import pathlib, sys
          dist = pathlib.Path("dist")
          archives = sorted(p for p in dist.iterdir() if p.is_file())
          # A manual run can build a single variant, so the count follows what
          # was actually requested rather than assuming both.
          want = 0
          if "${{ steps.want.outputs.web }}" == "1":
              want += 1
          if "${{ steps.want.outputs.webview }}" == "1":
              want += 1
          if len(archives) != want:
              sys.exit("expected %d archives, got %d: %s" %
                       (want, len(archives), [a.name for a in archives]))
          for a in archives:
              size = a.stat().st_size
              print("%-60s %8.2f MB" % (a.name, size / 1e6))
              if size < 1_000_000:
                  sys.exit("%s is suspiciously small" % a.name)
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flashsight-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------
  # WhaleUI variant (opt-in).
  #
  # FlashSight links WhaleUI's own engine, which this repo does not vendor: the
  # job has to clone WhaleUI, build its static library, and let xmake install
  # its xrepo dependencies (lexbor, utf8proc, SDL3, SDL3_ttf, SDL3_image). That
  # is a different repository and a much longer build, so it is OFF by default.
  #
  # Enable with the repository variable ENABLE_WHALEUI=true; point
  # WHALEUI_REPO at your fork if needed. Windows x86_64 only for now: that is
  # the platform the engine has been built and tested on.
  # ------------------------------------------------------------------------
  whaleui:
    needs: prepare
    if: |
      vars.ENABLE_WHALEUI == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.whaleui == 'true')
    name: windows-x86_64-whaleui
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          actions-cache-folder: .xmake-cache

      - name: Install MSYS2 mingw64
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Set toolchain paths
        run: |
          echo "MINGW_DIR=C:/msys64/mingw64" >> "$GITHUB_ENV"
          echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      # The engine lives in its own repository; check it out next to this one.
      - name: Checkout WhaleUI
        run: |
          repo="${WHALEUI_REPO:-https://github.com/THZrry/WhaleUI.git}"
          ref="${WHALEUI_REF:-main}"
          echo "cloning $repo ($ref)"
          git clone --depth 1 --branch "$ref" "$repo" ../WhaleUI \
            || git clone --depth 1 "$repo" ../WhaleUI
        env:
          WHALEUI_REPO: ${{ vars.WHALEUI_REPO }}
          WHALEUI_REF: ${{ vars.WHALEUI_REF }}

      - name: Build WhaleUI
        run: |
          cd ../WhaleUI
          # The xrepo packages (lexbor, utf8proc, SDL3, SDL3_ttf, SDL3_image)
          # install during configure. libwhaleui-full is what FlashSight links.
          # `-p mingw` makes the output land in build/mingw/<arch>/<mode>,
          # which is the layout the local build uses too.
          xmake f -y -p mingw -m release --toolchain=mingw --mingw="$MINGW_DIR"
          xmake b -y whaleui-full

      - name: Fetch 3rdparty (FlashSight)
        run: python scripts/fetch_3rdparty.py

      - name: Configure (whaleui)
        run: |
          # WhaleUI's output directory depends on how it was configured
          # (build/<plat>/<arch>/<mode>, and the plat name differs between
          # `-p mingw` and a host build), so locate the archive rather than
          # hardcoding a layout.
          LIB=$(find ../WhaleUI/build -name 'libwhaleui-full.a' | head -1)
          if [ -z "$LIB" ]; then
            echo "libwhaleui-full.a not found under ../WhaleUI/build"
            exit 1
          fi
          LIBDIR=$(dirname "$LIB")
          echo "whaleui libdir: $LIBDIR"
          xmake f -y -m release --arch=x86_64 --toolchain=mingw \
            --mingw="$MINGW_DIR" \
            --whaleui_libdir="$LIBDIR" \
            --whaleui_dir="$(cd ../WhaleUI && pwd)"

      - name: Build (whaleui)
        run: xmake -y b flashsight-whaleui

      # WhaleUI reads its stylesheet from disk (through the engine's VFS), so
      # the build copies web/ next to the exe and the package has to carry it.
      - name: Verify assets and package
        run: |
          python - <<'PY'
          import pathlib, sys
          root = next(p for p in pathlib.Path("build").glob("*/*/release") if p.is_dir())
          exe = root / "flashsight-whaleui.exe"
          if not exe.is_file():
              sys.exit("missing flashsight-whaleui.exe in %s" % root)
          web = root / "web"
          if not (web / "style.css").is_file():
              sys.exit("web/style.css was not copied next to the exe")
          print("whaleui exe ok, assets:", sorted(p.name for p in web.iterdir()))
          PY
          python scripts/package.py --variant whaleui \
            --build-dir build --out dist \
            --version "${{ needs.prepare.outputs.version }}" \
            --platform windows-x86_64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flashsight-windows-x86_64-whaleui
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------
  # Attach every artifact to the release that triggered the run.
  # ------------------------------------------------------------------------
  release:
    needs: [prepare, build, whaleui]
    # `whaleui` is opt-in (vars.ENABLE_WHALEUI), so it is normally SKIPPED and
    # must not block the release. Listing it in `needs` still makes the release
    # wait for it when it does run, so its archive is attached too.
    if: |
      always() &&
      needs.prepare.result == 'success' && needs.build.result == 'success' &&
      (needs.whaleui.result == 'success' || needs.whaleui.result == 'skipped') &&
      (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -lh dist
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          # A tag push has no release object yet; create one as a draft so the
          # notes can be written before it goes public.
          draft: ${{ github.event_name != 'release' }}
          generate_release_notes: true
