name: build

# Releases are cut from tags: `v0.1.0` (and pre-releases like `v0.2.0-rc1`).
# Publishing a GitHub Release also triggers a build, so assets can be attached
# to it after the fact. workflow_dispatch builds without publishing; each
# variant is its OWN on/off input, so a manual run compiles exactly the
# variants it asks for instead of picking one value from a three-way list.
#
#   Web      : one self-contained executable per platform (wasm UI embedded,
#              served over the embedded HTTP server)
#   Webview  : one executable per platform (native window via the OS web engine)
#
# Web and webview are built in ONE job: they share the output directory and the
# executable name carries the variant (flashsight-web / flashsight-webview),
# and switching variants only recompiles the two backend files plus main.cpp.
# Building them separately would compile the whole project twice.
#
# WhaleUI is a THIRD variant of the same app, not a separate build system: the
# flashsight-whaleui target exists on every platform and only needs a built
# WhaleUI engine passed via --whaleui_libdir. This repo does not vendor that
# engine and it is currently not usable in CI, so the CI matrix intentionally
# does NOT build WhaleUI (all platforms disabled, not just x64). Build it
# locally with `xmake f --whaleui_libdir=...` + `xmake build flashsight-whaleui`.
# See doc-internal/ui-whaleui.md.
on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      web:
        description: "Build the Web variant (browser + embedded HTTP server)"
        type: boolean
        default: true
      webview:
        description: "Build the WebView variant (native window, OS web engine)"
        type: boolean
        default: true
permissions:
  contents: write

env:
  # xmake is a single binary; pinning the version keeps the build reproducible.
  XMAKE_VERSION: v3.0.6
  # Emscripten compiles the UI to wasm. The bundle is architecture-independent,
  # so every runner uses the same SDK.
  EMSDK_VERSION: 3.1.61

jobs:
  # ------------------------------------------------------------------------
  # Resolve the version and the matrix once, so every job agrees on the names
  # that end up in the release.
  # ------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: v
        name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            ref="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            ref="${{ github.ref_name }}"
          else
            ref="0.0.0-dev"
          fi
          # Strip a leading v so the archive names stay uniform.
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${ref#v}"
      - id: m
        name: Build matrix
        run: |
          # One entry per (runner, target arch). Supported today:
          #   windows-x86_64   llvm-mingw x86_64
          #   windows-arm64    llvm-mingw aarch64 (cross from the x64 runner)
          #   macos-arm64      Xcode clang, WKWebView
          #   linux-x86_64     gcc, GTK4 + WebKitGTK 6.0
          #   linux-aarch64    gcc on an arm64 runner, GTK4 + WebKitGTK 6.0
          #
          # Nothing else is attempted: webview has no backend for the remaining
          # platforms, so a package would not run there.
          #
          # `toolchain` empty means "the platform default" (clang on macOS).
          # `mingw` selects how the Windows toolchain is installed; the actual
          # directory is resolved in the build job.
          matrix=$(cat <<'JSON'
          {
            "include": [
              {
                "name": "windows-x86_64",
                "os": "windows-latest",
                "arch": "x86_64",
                "plat": "mingw",
                "toolchain": "mingw",
                "mingw": "llvm",
                "emsdk": "3.1.61",
                "py": "python"
              },
              {
                "name": "windows-arm64",
                "os": "windows-latest",
                "arch": "arm64",
                "plat": "mingw",
                "toolchain": "mingw",
                "mingw": "llvm",
                "emsdk": "3.1.61",
                "py": "python"
              },
              {
                "name": "macos-arm64",
                "os": "macos-15",
                "arch": "arm64",
                "toolchain": "",
                "mingw": "",
                "emsdk": "3.1.61",
                "py": "python3"
              },
              {
                "name": "linux-x86_64",
                "os": "ubuntu-24.04",
                "arch": "x86_64",
                "toolchain": "gcc",
                "mingw": "",
                "emsdk": "3.1.61",
                "py": "python3"
              },
              {
                "name": "linux-aarch64",
                "os": "ubuntu-24.04-arm",
                "arch": "arm64",
                "toolchain": "gcc",
                "mingw": "",
                "emsdk": "3.1.47",
                "py": "python3"
              }
            ]
          }
          JSON
          )
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The version stamp falls back to `git describe`, which needs tags.
          fetch-depth: 0

      # ---- toolchains -----------------------------------------------------
      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          actions-cache-folder: .xmake-cache

      - name: Install llvm-mingw (Windows x86_64 and arm64)
        if: matrix.mingw == 'llvm'
        shell: pwsh
        run: |
          # Both Windows targets use the same official llvm-mingw package. It
          # contains target-prefixed gcc/g++ wrappers for x86_64 AND aarch64.
          # Do not use MSYS2 here: its mingw64/bin can be empty in CI, which is
          # what produced "missing .../x86_64-w64-mingw32-gcc.exe".
          $ver = "20240417"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\llvm-mingw -Force
          $dir = (Get-ChildItem C:\llvm-mingw -Directory | Select-Object -First 1).FullName
          $prefix = if ("${{ matrix.arch }}" -eq "arm64") {
            "aarch64-w64-mingw32"
          } else {
            "x86_64-w64-mingw32"
          }
          $gcc = Join-Path $dir "bin\$prefix-gcc.exe"
          $gxx = Join-Path $dir "bin\$prefix-g++.exe"
          if (-not (Test-Path $gcc) -or -not (Test-Path $gxx)) {
            Write-Error "llvm-mingw is missing $prefix-gcc/g++ under $dir\bin"
            exit 1
          }
          "MINGW_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "llvm-mingw at $dir, prefix $prefix"
          & $gcc --version | Select-Object -First 1

      - name: Install Linux dependencies
        if: matrix.os != 'windows-latest' && !startsWith(matrix.os, 'macos-')
        run: |
          sudo apt-get update
          # GTK4 + WebKitGTK 6.0 are what the Linux webview backend compiles
          # against (see the webview_host target in xmake.lua).
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file curl \
            libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ matrix.emsdk || env.EMSDK_VERSION }}
          actions-cache-folder: .emsdk-cache

      # ---- dependencies ---------------------------------------------------
      - name: Fetch 3rdparty
        run: ${{ matrix.py }} scripts/fetch_3rdparty.py

      # mbedtls is built from SOURCE by the `mbedtls_src` target with the
      # project toolchain (fetch_3rdparty.py downloads it). It is deliberately
      # not an xmake package: a prebuilt archive produced by another compiler
      # mixes two C runtimes, and every HTTPS request then crashed inside
      # RtlFreeHeap. Nothing extra is needed here - just the sources.

      # The three variants are three xmake targets. Configure once, then build
      # exactly the selected target names; no --variant switch, no wrapper
      # script, and adding/removing a variant cannot leave a stale cached value.
      - name: Select variants
        id: want
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            web="${{ github.event.inputs.web }}"
            webview="${{ github.event.inputs.webview }}"
          else
            web=true
            webview=true
          fi
          [ "$web" = "true" ] && web=1 || web=0
          [ "$webview" = "true" ] && webview=1 || webview=0
          if [ "$web" = "0" ] && [ "$webview" = "0" ]; then
            echo "at least one of web/webview must be enabled"
            exit 1
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "webview=$webview" >> "$GITHUB_OUTPUT"
          echo "selected: web=$web webview=$webview"

      - name: Configure
        run: |
          args=(-y -m release --arch=${{ matrix.arch }})
          # Windows uses the MinGW PLATFORM (-p mingw), not just the MinGW
          # toolchain on the default windows platform. That is what makes
          # xmake resolve cc/ld/windres from the same toolchain for every
          # target; without it the second xmake build (webview) could fail
          # with "cannot get program for cc".
          if [ -n "${{ matrix.plat }}" ]; then
            args+=(--plat=${{ matrix.plat }})
          elif [ -n "${{ matrix.toolchain }}" ]; then
            # -p mingw already selects the mingw toolchain; passing it again
            # is redundant and has confused arm64 probing on some versions.
            args+=(--toolchain=${{ matrix.toolchain }})
          fi
          if [ -n "${MINGW_DIR:-}" ]; then
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              prefix=aarch64-w64-mingw32
            else
              prefix=x86_64-w64-mingw32
            fi
            # llvm-mingw/MSYS2 may have no un-prefixed gcc.exe; --mingw alone
            # then fails detection. Pass target-prefixed compilers explicitly.
            args+=(--mingw="$MINGW_DIR"
                   --cc="$MINGW_DIR/bin/$prefix-gcc.exe"
                   --cxx="$MINGW_DIR/bin/$prefix-g++.exe")
          fi
          echo "xmake f -c ${args[*]}"
          xmake f -c "${args[@]}"

      - name: Build selected targets
        run: |
          targets=()
          if [ "${{ steps.want.outputs.web }}" = "1" ]; then targets+=(flashsight-web); fi
          if [ "${{ steps.want.outputs.webview }}" = "1" ]; then targets+=(flashsight-webview); fi
          # Build ONE target per invocation (xmake's build task takes one
          # name), and reconfigure before EACH target. This is deliberate: on
          # some xmake versions building the wasm/Web target first leaves the
          # next invocation looking for a bare `cc` (the "first build passes,
          # second says cannot get program for cc" failure). A fresh f before
          # each target makes every invocation independent.
          cfg=(-y -m release --arch=${{ matrix.arch }})
          if [ -n "${{ matrix.plat }}" ]; then cfg+=(--plat=${{ matrix.plat }}); fi
          if [ -n "${{ matrix.toolchain }}" ] && [ -z "${{ matrix.plat }}" ]; then
            cfg+=(--toolchain=${{ matrix.toolchain }})
          fi
          if [ -n "${MINGW_DIR:-}" ]; then
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              prefix=aarch64-w64-mingw32
            else
              prefix=x86_64-w64-mingw32
            fi
            cfg+=(--mingw="$MINGW_DIR"
                  --cc="$MINGW_DIR/bin/$prefix-gcc.exe"
                  --cxx="$MINGW_DIR/bin/$prefix-g++.exe")
          fi
          for t in "${targets[@]}"; do
            echo "xmake f -c ${cfg[*]}"
            # -c clears the cached configuration first. Some xmake versions
            # keep a target-level platform/toolchain (the wasm target's
            # set_plat/set_toolchains) in the config after a build; the next
            # target then probes a missing `cc`. Clearing before each target
            # makes the two invocations independent.
            xmake f -c "${cfg[@]}" >/dev/null
            echo "xmake build -v $t"
            # -v is required here: the Windows webview failure is a toolchain
            # probe ("cannot get program for cc"), and the verbose log names
            # the target/toolchain that triggered it.
            xmake build -v "$t"
          done

      # The two failures that actually shipped a broken package: a webview exe
      # with no embedded CSS (the asset pack had been overwritten by the web
      # variant's), and a "whaleui" package that was really the web build.
      # Both are cheap to assert here and impossible to notice afterwards.
      #
      # The lookup is deliberately platform-agnostic: the binary is
      # flashsight-web.exe on Windows and flashsight-web elsewhere, and the
      # output directory is build/<plat>/<arch>/<mode> (so macosx/arm64 and
      # linux/x86_64 do not look like windows/x64).
      - name: Verify embedded assets
        run: |
          ${{ matrix.py }} - <<'PY'
          import pathlib, sys

          roots = sorted(p for p in pathlib.Path("build").glob("*/*/release")
                         if p.is_dir())
          if not roots:
              sys.exit("no build/<plat>/<arch>/release directory found")
          root = roots[0]
          print("output dir:", root)

          def find(variant):
              for name in ("flashsight-%s.exe" % variant, "flashsight-%s" % variant):
                  p = root / name
                  if p.is_file():
                      return p
              return None

          wanted = []
          if "${{ steps.want.outputs.web }}" == "1":
              wanted.append(("web", (b"#fs-root", b"fs_ui.wasm", b"--text-dim")))
          if "${{ steps.want.outputs.webview }}" == "1":
              wanted.append(("webview", (b"#fs-root", b"--text-dim")))
          if not wanted:
              sys.exit("no variant was selected")

          for variant, needles in wanted:
              p = find(variant)
              if p is None:
                  sys.exit("missing flashsight-%s in %s (build the target "
                           "flashsight-%s)" % (variant, root, variant))
              data = p.read_bytes()
              for n in needles:
                  if n not in data:
                      sys.exit("%s is missing embedded asset %r - the asset pack "
                               "was not rebuilt for this target" % (p.name, n))
              print("%-28s %8.2f MB  assets ok" % (p.name, len(data) / 1e6))
          PY

      # ---- package --------------------------------------------------------
      # One archive per variant per platform:
      #   flashsight-<version>-<platform>-web.zip|tar.gz
      #   flashsight-<version>-<platform>-webview.zip|tar.gz
      - name: Package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if [ "${{ steps.want.outputs.web }}" = "1" ]; then
            ${{ matrix.py }} scripts/package.py --variant web \
              --build-dir build --out dist \
              --version "$VERSION" --platform "${{ matrix.name }}"
          fi
          if [ "${{ steps.want.outputs.webview }}" = "1" ]; then
            ${{ matrix.py }} scripts/package.py --variant webview \
              --build-dir build --out dist \
              --version "$VERSION" --platform "${{ matrix.name }}"
          fi

      - name: Verify archives
        run: |
          # A package that is suspiciously small means the executable or the
          # embedded assets are missing - catch that here, not after publishing.
          ${{ matrix.py }} - <<'PY'
          import pathlib, sys
          dist = pathlib.Path("dist")
          archives = sorted(p for p in dist.iterdir() if p.is_file())
          # A manual run can build a single variant, so the count follows what
          # was actually requested rather than assuming both.
          want = 0
          if "${{ steps.want.outputs.web }}" == "1":
              want += 1
          if "${{ steps.want.outputs.webview }}" == "1":
              want += 1
          if len(archives) != want:
              sys.exit("expected %d archives, got %d: %s" %
                       (want, len(archives), [a.name for a in archives]))
          for a in archives:
              size = a.stat().st_size
              print("%-60s %8.2f MB" % (a.name, size / 1e6))
              if size < 1_000_000:
                  sys.exit("%s is suspiciously small" % a.name)
          PY

      - name: Build AppImages (Linux)
        if: startsWith(matrix.name, 'linux-')
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          web_exe="$(find build -path '*/.objs/*' -prune -o -type f -name flashsight-web -print | head -n1)"
          wv_exe="$(find build -path '*/.objs/*' -prune -o -type f -name flashsight-webview -print | head -n1)"
          if [ "${{ steps.want.outputs.web }}" = "1" ]; then
            bash scripts/make_appimage.sh web "$web_exe" \
              "dist/flashsight-${VERSION}-${{ matrix.name }}-web.AppImage" \
              "$VERSION" "${{ matrix.arch }}"
          fi
          if [ "${{ steps.want.outputs.webview }}" = "1" ]; then
            bash scripts/make_appimage.sh webview "$wv_exe" \
              "dist/flashsight-${VERSION}-${{ matrix.name }}-webview.AppImage" \
              "$VERSION" "${{ matrix.arch }}"
          fi

      - name: Verify AppImages (Linux)
        if: startsWith(matrix.name, 'linux-')
        run: |
          for f in dist/*.AppImage; do
            size=$(stat -c%s "$f")
            echo "$f $size bytes"
            test "$size" -gt 1000000
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flashsight-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------
  # Attach every artifact to the release that triggered the run.
  # ------------------------------------------------------------------------
  release:
    needs: [prepare, build]
    if: |
      always() &&
      needs.prepare.result == 'success' && needs.build.result == 'success' &&
      (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -lh dist
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          # A tag push has no release object yet; create one as a draft so the
          # notes can be written before it goes public.
          draft: ${{ github.event_name != 'release' }}
          generate_release_notes: true
